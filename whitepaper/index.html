<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introducing Skopo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Schibsted+Grotesk:wght@500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<!--
  The Skopo whitepaper, rendered from Markdown.

  The language, first that applies: ?lang=zh or ?lang=en; the reader's last choice on this page; the
  first of the browser's languages that is Chinese or English; English. The button beside the theme
  switch changes it in place, and only languages the page can load are offered.

  Where the Markdown comes from, first that works:
    1. the copy build.mjs embeds in #skopo-md;
    2. ?md=<url> (only when served from localhost or opened from disk), or ./zh.md or ./en.md next to
       this file, when served over http;
    3. the published copy on the repository's main branch (REMOTE below), which also works when this
       file is opened from disk, as long as the repository is public.

  The design comes from Claude Design (design/Skopo-Whitepaper.dc.html); this file reproduces it
  without its runtime. Markdown conventions are described in design-prompt.md.
-->
<style>
html,body{margin:0;padding:0;background:#FFFFFF}
body:has([data-skopo][data-theme="dark"]){background:#111111}
[data-skopo]{--bg:#FFFFFF;--panel:#F7F7F5;--code-bg:#F4F4F2;--ink:#111111;--ink-body:#262626;--ink2:#555555;--ink3:#7A7A7A;--ink4:#A3A3A3;--line:#E6E6E6;--line2:#CFCFCF;--accent:#D9531E;--accent-deep:#B8431A;--accent-soft:#FBE9E1;--accent-tint:#F0B9A3;--l-spec:#111111;--l-spec-f:#E4E4E4;--l-prod:#4D4D4D;--l-prod-f:#EDEDED;--l-tech:#8F8F8F;--l-tech-f:#F3F3F3;--l-code:#C4C4C4;--l-code-f:#F8F8F8;--display:"Schibsted Grotesk","PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;--sans:"Instrument Sans","PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC","Noto Sans SC",monospace;--measure:37em;--wide:960px;--lh:1.9;--gutter:20px;text-autospace:normal;text-spacing-trim:normal;line-break:strict;-webkit-font-smoothing:antialiased;font-kerning:normal;box-sizing:border-box;width:100%;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:var(--lh)}
[data-skopo][lang="en"]{--measure:40em;--lh:1.65}
@media screen{[data-skopo][data-theme="dark"]{--bg:#111111;--panel:#191919;--code-bg:#1E1E1E;--ink:#F5F5F5;--ink-body:#DCDCDC;--ink2:#B3B3B3;--ink3:#8A8A8A;--ink4:#6B6B6B;--line:#2A2A2A;--line2:#3D3D3D;--accent:#F0703D;--accent-deep:#F7A07A;--accent-soft:#33201A;--accent-tint:#8A3F22;--l-spec:#F5F5F5;--l-spec-f:#2E2E2E;--l-prod:#BDBDBD;--l-prod-f:#262626;--l-tech:#7D7D7D;--l-tech-f:#1F1F1F;--l-code:#4A4A4A;--l-code-f:#171717;color-scheme:dark}}
[data-skopo] a{color:var(--accent);text-decoration:none}
[data-skopo] a:hover{text-decoration:underline;text-underline-offset:3px}
[data-skopo] ::selection{background:#111111;color:#fff}

/* chrome */
.top-btns{position:fixed;top:16px;right:16px;z-index:5;display:flex;gap:8px}
.theme-btn{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--ink2);background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:7px 14px;cursor:pointer}
.theme-btn:hover{color:var(--ink);border-color:var(--accent)}
.shell{display:grid;grid-template-columns:minmax(0,1fr);max-width:1320px;margin:0 auto}
.side{display:none;position:sticky;top:0;height:100vh;overflow-y:auto;box-sizing:border-box;padding:56px 20px 40px 36px;border-right:1px solid var(--line)}
.label-caps{font-weight:600;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3)}
.side .label-caps{margin-bottom:16px}
.side .doc-title{font-size:14px;line-height:1.5;font-weight:600;color:var(--ink);margin-bottom:28px;text-wrap:balance}
.side nav{display:flex;flex-direction:column}
.side nav a{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px;padding:6px 0;text-decoration:none;color:var(--ink2);font-size:13.5px;line-height:1.45}
.side nav a .n{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.side nav a.active{color:var(--ink)}
.side nav a.active .n{color:var(--accent)}
main{min-width:0;padding:0 var(--gutter) 160px}

/* cover */
.cover{display:flex;flex-direction:column;justify-content:flex-end;box-sizing:border-box;padding:120px 0 64px;max-width:var(--wide);min-height:92vh}
.cover .status{font-size:14px;line-height:1.6;color:var(--ink2);margin-bottom:48px;font-variant-numeric:tabular-nums}
.cover h1{margin:0;font-family:var(--display);font-size:clamp(34px,5.4vw,62px);line-height:1.18;font-weight:700;letter-spacing:-0.015em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere;max-width:14em;color:var(--ink)}
.cover .subtitle{margin:24px 0 0;font-family:var(--display);font-size:clamp(18px,2.2vw,24px);line-height:1.4;font-weight:600;color:var(--ink2);max-width:28em;text-wrap:balance}
.inline-toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 32px;margin-top:88px;padding-top:20px;border-top:1px solid var(--line)}
.inline-toc .label-caps{grid-column:1 / -1;margin-bottom:8px}
.inline-toc a{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px;padding:7px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px;line-height:1.45}
.inline-toc a .n{font-family:var(--mono);font-size:12px;color:var(--ink3)}

/* sections and text */
section{padding-top:128px}
.opener{max-width:var(--wide);border-top:1px solid var(--ink);padding-top:22px;margin-bottom:56px;display:flex;flex-direction:column;gap:8px}
.opener .num{font-family:var(--display);font-size:15px;line-height:1.4;font-weight:600;letter-spacing:.02em;color:var(--accent)}
.opener h2{margin:0;font-family:var(--display);font-size:clamp(28px,3.4vw,38px);line-height:1.25;font-weight:700;letter-spacing:-0.015em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere;color:var(--ink)}
h3{margin:64px 0 18px;max-width:var(--measure);display:flex;gap:14px;align-items:baseline;font-family:var(--display);font-size:21px;line-height:1.45;font-weight:600;letter-spacing:-0.01em;color:var(--ink)}
h3 .num{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--accent)}
p.body{margin:0 0 1.2em;max-width:var(--measure);font-family:var(--sans);font-size:17px;line-height:var(--lh);color:var(--ink-body);text-wrap:pretty}
ul.body,ol.body{margin:0 0 1.4em;max-width:var(--measure);color:var(--ink-body)}
ul.body{padding-left:1.25em}
ol.body{padding-left:1.5em}
ul.body li,ol.body li{margin:0 0 .55em;padding-left:.3em;text-wrap:pretty}
strong{font-weight:600;color:var(--ink)}
code.inl{font-family:var(--mono);font-size:.86em;padding:.12em .36em;border-radius:4px;background:var(--code-bg);color:var(--ink)}
a.codelink{font-family:var(--mono);font-size:.86em}
blockquote.pull{margin:72px 0;padding:0;max-width:var(--wide)}
blockquote.pull .bar{width:48px;height:3px;border-radius:2px;background:var(--accent);margin-bottom:28px}
blockquote.pull p{margin:0;max-width:20em;font-family:var(--display);font-size:clamp(26px,3.2vw,36px);line-height:1.4;font-weight:700;letter-spacing:-0.015em;color:var(--ink);text-wrap:balance}
blockquote.bq{margin:0 0 1.4em;padding:0 0 0 1.2em;max-width:var(--measure);color:var(--ink2);border-left:2px solid var(--line2)}
.stats{margin:48px 0 64px;max-width:var(--wide);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:28px 20px}
.stat{border-top:2px solid var(--ink);padding-top:16px}
.stat .v{display:flex;align-items:baseline;flex-wrap:wrap;color:var(--ink);line-height:1.1}
.stat .pre,.stat .unit{font-size:16px;font-weight:500;color:var(--ink2);white-space:pre}
.stat .num{font-family:var(--display);font-size:44px;font-weight:700;letter-spacing:-0.025em;font-variant-numeric:tabular-nums}
.stat .lab{margin-top:10px;font-size:13.5px;line-height:1.55;color:var(--ink3);text-wrap:pretty}
.bet{margin:48px 0 56px;max-width:var(--measure);border:1px dashed var(--accent);border-radius:12px;padding:24px 28px 8px}
.bet .label-caps{color:var(--accent);margin-bottom:12px}
.bet p{margin:0 0 1em;font-size:17px;line-height:var(--lh);color:var(--ink);text-wrap:pretty}
.note{margin:4px 0 28px;max-width:var(--measure);border-top:1px solid var(--line2);padding-top:10px;font-size:14px;line-height:1.7;color:var(--ink2)}
.note p{margin:0 0 .6em;font-size:14px;color:var(--ink2)}
.skopo{margin:28px 0 36px;max-width:min(100%,820px);box-sizing:border-box;background:var(--code-bg);border-radius:8px;padding:10px 0 18px;color:var(--ink)}
.skopo .sk-bar{display:flex;justify-content:flex-end;gap:4px;padding:0 10px 4px}
.skopo .sk-bar button{font-family:var(--mono);font-weight:600;font-size:11.5px;line-height:1;color:var(--ink3);background:none;border:1px solid var(--line2);border-radius:999px;padding:5px 10px;cursor:pointer}
.skopo .sk-bar button:hover{color:var(--ink);border-color:var(--ink3)}
.skopo .sk-bar button[aria-pressed="true"]{color:#FFFFFF;border-color:var(--accent);background:var(--accent)}
.skopo[data-view="rendered"] .sk-source,.skopo[data-view="source"] .sk-rendered{display:none}
.skopo .sk-sec{border-left:2px solid var(--l-spec);padding:2px 26px 2px 20px;margin-top:16px}
.skopo .sk-sec:first-child{margin-top:0}
.skopo .sk-file{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:6px;font-family:var(--mono);font-size:12px;line-height:1.5}
.skopo .sk-layer{font-weight:700}
.skopo .sk-path{color:var(--ink3)}
.skopo .sk-rendered{font-family:var(--sans);font-size:15px;line-height:1.75;color:var(--ink-body)}
.skopo .sk-rendered ul{margin:0 0 .4em;padding-left:1.2em}
.skopo .sk-rendered li{margin:0 0 .35em}
.skopo .sk-rendered p{margin:0 0 .5em}
.skopo .sk-rendered blockquote{margin:.3em 0 .6em;padding-left:1em;border-left:2px solid var(--line2);color:var(--ink2)}
.skopo .sk-rendered .sk-h{font-weight:700;color:var(--ink);margin:0 0 .5em}
.skopo .sk-rendered table{border-collapse:collapse;margin:.2em 0 .8em;font-size:14px;line-height:1.6}
.skopo .sk-rendered th,.skopo .sk-rendered td{padding:5px 18px 5px 0;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
.skopo .sk-rendered td:first-child{font-weight:600;color:var(--ink)}
.skopo .sk-source pre{margin:0;font-family:var(--mono);font-size:13.5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.skopo .kw{color:var(--accent);font-weight:700}
.skopo .anc,.skopo .id,.skopo code{font-family:var(--mono);font-size:.86em;color:var(--ink3)}
.skopo .anc b{font-weight:700}
.skopo .ref{font-family:var(--mono);font-size:.86em;color:var(--ink4)}
pre.code{margin:28px 0 36px;max-width:min(100%,820px);width:max-content;box-sizing:border-box;background:var(--code-bg);border-radius:8px;padding:18px 24px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.7;color:var(--ink)}
.tbl{margin:32px 0 44px;max-width:var(--wide);overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.65}
.tbl th{text-align:left;font-weight:500;font-size:13px;line-height:1.5;color:var(--ink3);padding:0 20px 10px 0;border-bottom:1px solid var(--ink);vertical-align:bottom}
.tbl td{padding:11px 20px 11px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-body)}
.tbl td:first-child{font-weight:600;color:var(--ink)}
figure.fig{margin:56px 0 64px;max-width:var(--wide)}
.figpanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:40px 32px;overflow-x:auto;color:var(--ink);font-family:var(--sans)}
.figpanel > div{min-width:720px}
figcaption{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-top:14px;max-width:var(--measure)}
figcaption .id{font-family:var(--mono);font-size:12px;color:var(--ink3)}
figcaption .t{font-size:15px;line-height:1.5;color:var(--ink2)}
.fig-pending{min-height:180px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:repeating-linear-gradient(135deg,transparent 0 10px,var(--line) 10px 11px);font-family:var(--mono);font-size:12px;color:var(--ink3)}
.loading{padding:120px var(--gutter);font-size:15px;color:var(--ink2);max-width:42em}
.loading code{font-family:var(--mono);font-size:.9em;background:var(--code-bg);padding:.1em .35em;border-radius:4px}

@media (min-width:720px){[data-skopo]{--gutter:48px}}
@media (min-width:1180px){[data-skopo]{--gutter:56px}.shell{grid-template-columns:260px minmax(0,1fr)}.side{display:block}.inline-toc{display:none}}
@media (min-width:1380px){.note{float:right;clear:right;width:220px;margin:6px 0 24px 32px}}
@media print{
html,body{background:#fff!important}
.side,.top-btns{display:none!important}
.shell{display:block!important;max-width:none!important}
main{padding:0!important}
.inline-toc{display:grid!important}
.cover{min-height:0!important;padding-top:2.4in!important;break-after:page}
section{break-before:page;padding-top:0!important}
.keep,table,pre,figure{break-inside:avoid}
h2,h3,.opener{break-after:avoid}
.figpanel{overflow:visible!important;zoom:.84}
.figpanel > div{min-width:0!important}
a[data-ext]::after{content:" (" attr(href) ")";font-family:var(--mono);font-size:.8em;color:var(--ink3);text-decoration:none}
.note{float:none!important;width:auto!important}
.skopo .sk-bar,.skopo .sk-source{display:none!important}
.skopo .sk-rendered{display:block!important}
@page{size:A4;margin:18mm 16mm}
}
</style>

<body>
<div id="app" data-skopo data-theme="light" lang="zh"><div class="loading">Loading…</div></div>
<script id="skopo-md">/* build.mjs embeds the Markdown here: window.SKOPO_MD = { zh: "…" } */</script>
<script>
'use strict';
(() => {
  // ---------- small DOM helper ----------
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'style') n.style.cssText = v;
      else if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return n;
  };
  const svg = (markup) => { const t = document.createElement('template'); t.innerHTML = markup.trim(); return t.content.firstChild; };

  const params = new URLSearchParams(location.search);
  // The published Markdown. raw.githubusercontent.com allows cross-origin reads of public
  // repositories only; a private repository answers 404 to a page, which has no credentials.
  const REMOTE = 'https://raw.githubusercontent.com/57blocks/skopo/main/whitepaper/';
  const UIS = {
    zh: { toc: '目录', bet: '我们的赌注', light: '浅色', dark: '深色', pending: '图未绘制', person: '人', raw: '显示 Markdown 原文', from: '自然语言', to: '编程语言', other: 'English', otherTitle: 'Read in English' },
    en: { toc: 'Contents', bet: 'Our bet', light: 'Light', dark: 'Dark', pending: 'Figure not drawn', person: 'people', raw: 'Show the Markdown source', from: 'Natural language', to: 'Programming language', other: '中文', otherTitle: '阅读中文版' },
  };
  const LANGS = Object.keys(UIS);
  const LANG_KEY = 'skopo-whitepaper-lang';
  // A build embeds the languages it offers; served or opened otherwise, both are offered.
  const OFFERED = window.SKOPO_MD ? LANGS.filter((l) => window.SKOPO_MD[l]) : LANGS;
  const stored = () => { try { return localStorage.getItem(LANG_KEY); } catch { return null; } };
  const store = (lang) => { try { localStorage.setItem(LANG_KEY, lang); } catch { /* private window: keep the choice for this visit only */ } };
  const browserLang = () => (navigator.languages?.length ? navigator.languages : [navigator.language || ''])
    .map((l) => String(l).toLowerCase().split('-')[0]).find((l) => LANGS.includes(l));
  let LANG = [params.get('lang'), window.SKOPO_LANG, stored(), browserLang(), 'en'].find((l) => OFFERED.includes(l)) || OFFERED[0];
  let UI = UIS[LANG];

  // ---------- Markdown ----------
  // A link keeps its target only if it is relative, or http, https or mailto: the Markdown may come
  // from elsewhere, and a javascript: link must never reach the page.
  const safeHref = (h) => { const scheme = /^([a-z][a-z0-9+.-]*):/i.exec(h.trim()); return !scheme || ['http', 'https', 'mailto'].includes(scheme[1].toLowerCase()) ? h : '#'; };
  // Inline: code, links, bold, italic. Returns DOM nodes.
  const inline = (s) => {
    const out = []; const re = /(`([^`]+)`)|(\[([^\]]+)\]\(([^)\s]+)\))|(\*\*([^*]+)\*\*)|(\*([^*\s][^*]*?)\*)/g;
    let last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) out.push(s.slice(last, m.index));
      if (m[1]) out.push(el('code', { class: 'inl' }, m[2]));
      else if (m[3]) {
        const tx = m[4];
        const href = safeHref(m[5]);
        out.push(/^`[^`]+`$/.test(tx) ? el('a', { href, 'data-ext': true, class: 'codelink' }, tx.slice(1, -1)) : el('a', { href, 'data-ext': true }, tx));
      } else if (m[6]) out.push(el('strong', {}, m[7]));
      else out.push(el('em', {}, m[9]));
      last = re.lastIndex;
    }
    if (last < s.length) out.push(s.slice(last));
    return out;
  };
  const plain = (s) => s.replace(/\*\*([^*]+)\*\*/g, '$1').replace(/`([^`]+)`/g, '$1').replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
  const quoted = (s) => [...s.matchAll(/[“"]([^”"]+)[”"]/g)].map((m) => m[1]);
  // A figure's labels: the quoted words right after 标 (or "label"), in the order they appear.
  const labelled = (lines) => lines.flatMap((l) => [...l.matchAll(/(?:标|label(?:led)?\s*)[“"]([^”"]+)[”"]/gi)].map((m) => m[1]));

  const tableCells = (row) => row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((x) => x.trim());

  function callout(buf) {
    const m = buf[0].match(/^\[!(\w+)\]\s*(.*)$/);
    if (!m) return { type: 'bq', text: buf.join(' ') };
    const T = m[1].toUpperCase();
    const rest = [m[2], ...buf.slice(1)].filter((x) => x.trim() !== '');
    if (T === 'QUOTE') return { type: 'quote', text: rest.join(' ') };
    if (T === 'STATS') return { type: 'stats', items: rest.map((l) => {
      const [v, lab] = l.split('|').map((x) => (x || '').trim());
      const mm = v.match(/^(\D*?)([\d][\d.,]*)(.*)$/);
      return mm ? { pre: mm[1], num: mm[2], unit: mm[3], label: lab } : { pre: '', num: v, unit: '', label: lab };
    }) };
    if (T === 'BET') return { type: 'bet', paras: rest };
    if (T === 'FIGURE') {
      const h = m[2].match(/^(fig-[\w-]+)\s*[·•|-]?\s*(.*)$/);
      return { type: 'figure', id: h ? h[1] : m[2], title: h ? h[2] : '', spec: buf.slice(1) };
    }
    return { type: 'note', paras: rest };
  }

  function parse(md) {
    const lines = md.replace(/\r/g, '').split('\n');
    const doc = { title: '', subtitle: '', status: '' };
    const sections = []; let cur = { id: 'intro', opener: false, num: '', title: '', blocks: [] }; sections.push(cur);
    const push = (b) => cur.blocks.push(b);
    const special = (l) => /^(#{1,6} |>|\||```|\s*[-*] |\s*\d+\. |---+\s*$)/.test(l);
    let i = 0, n = 0, m;
    while (i < lines.length) {
      const L = lines[i];
      if (/^\s*$/.test(L) || /^---+\s*$/.test(L)) { i++; continue; }
      if ((m = L.match(/^# (.+)/))) { doc.title = m[1].trim(); i++; continue; }
      if ((m = L.match(/^## (.+)/))) {
        const t = m[1].trim(); const mm = t.match(/^(§\s?\d+)\s+(.*)$/);
        cur = { id: 's' + (n++), opener: true, num: mm ? mm[1] : '', title: mm ? mm[2] : t, blocks: [] }; sections.push(cur); i++; continue;
      }
      if ((m = L.match(/^#{3,6} (.+)/))) { const mm = m[1].match(/^(\d+(?:\.\d+)*)\s+(.*)$/); push({ type: 'h3', num: mm ? mm[1] : '', text: mm ? mm[2] : m[1] }); i++; continue; }
      if (L.startsWith('```')) {
